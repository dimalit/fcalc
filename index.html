<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./mathquill//mathquill.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>
    <script src="./mathquill/mathquill.js"></script>
    <script>
        var MQ = MathQuill.getInterface(2);
    </script>

    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">

    <script src="./tree.js"></script>
    <script src="./parser.js"></script>
    <script src="./generator.js"></script>
</head>
<body>
    <div class="calc-container">
        <div id="output"></div>
        <h2 class="logo">Calculator</h2>
        <span type="text" id="inputContainer" class="input-bar" placeholder="Input"> </span>
        <!--button id="submitBtn" class="input-button">Submit</button-->

        <br/>

        <div id="keyboard-container">

        <div class="key" id="kA">a</div>
        <div class="key" id="kB">b</div>
        <div class="key" id="kCde"><span>c<sub>de</sub></span></div>
        <div class="key" id="kF">f</div>
        <div class="key" id="kG">g</div>
        <div class="key" id="kH">h</div>

        <div class="key" id="kI">i</div>
        <div class="key" id="kJk"><span>j<sub>k</sub></span></div>
        <div class="key" id="kL">l</div>
        <div class="key" id="kM">m</div>
        <div class="key" id="kNopq"><span>n<sub>opq</sub></span></div>
        <div class="key" id="kRs"><span>r<sub>s</sub></span></div>

        <div class="key" id="kT">t</div>
        <div class="key" id="kU">u</div>
        <div class="key" id="kVw"><span>v<sub>w</sub></span></div>
        <div class="key" id="kX">x</div>
        <div class="key" id="kY">y</div>
        <div class="key" id="kZ">z</div>

        <hr/>

        <div class="key" id="kSub"><span>a<sub>x</sub></span></div>
        <div class="key" id="kSup"><span>a<sup>x</sup></span></div>
        <div class="key" id="k">( )</div>
        <div class="key" id="kAssign">=</div>
        <div class="key" id="kLess">&lt;</div>
        <div class="key" id="kGreater">&gt;</div>

        <div class="key" id="kPi">&pi;</div>
        <div class="key" id="k">!</div>
        <div class="key" id="kMod">mod</div>
        <div class="key" id="kGreek">&alpha;&beta;</div>
        <div class="key" id="kUpper">aA</div>
        <div class="key" id="kAnd">&and;&or;&not;</div>

        <hr/>

        <div class="key" id="kSin">sin</div>
        <div class="key" id="kDiv">/</div>
        <div class="key" id="k7">7</div>
        <div class="key" id="k8">8</div>
        <div class="key" id="k9">9</div>
        <div class="key" id="kEnter">&#9166;</div>

        <div class="key" id="kCos">cos</div>
        <div class="key" id="kTimes">&times;</div>
        <div class="key" id="k4">4</div>
        <div class="key" id="k5">5</div>
        <div class="key" id="k6">6</div>
        <div class="key" id="kC">C</div>

        <div class="key" id="kLog">log</div>
        <div class="key" id="kMinus">-</div>
        <div class="key" id="k1">1</div>
        <div class="key" id="k2">2</div>
        <div class="key" id="k3">3</div>
        <div class="key" id="kBksp">&#9003;</div>

        <div class="key" id="kSqrt">&radic;</div>
        <div class="key" id="kPlus">+</div>
        <div class="key" id="k0">0</div>
        <div class="key" id="kDot">.,</div>
        <div class="key" id="kLeft">&larr;</div>
        <div class="key" id="kRight">&rarr;</div>

        </div>
    </div>

    <script type="module">

        function onKey(evt){
            let id = evt.currentTarget.id;
            switch(id){
            case "k0":
                writeInput("0");
                break;
            case "k1":
                writeInput("1");
                break;
            case "k2":
                writeInput("2");
                break;
            case "k3":
                writeInput("3");
                break;
            case "k4":
                writeInput("4");
                break;
            case "k5":
                writeInput("5");
                break;
            case "k6":
                writeInput("6");
                break;
            case "k7":
                writeInput("7");
                break;
            case "k8":
                writeInput("8");
                break;
            case "k9":
                writeInput("9");
                break;
            case "kDiv":
                writeInput("/");
                break;
            case "kTimes":
                writeInput("*");
                break;
            case "kMinus":
                writeInput("-");
                break;
            case "kPlus":
                writeInput("+");
                break;
            case "kSqrt":
                writeCmd("\\sqrt");
                break;
            case "kSin":
                writeCmd("\\sin");
                break;
            case "kCos":
                writeCmd("\\cos");
                break;
            case "kLog":
                writeCmd("\\log");
                break;
            case "kPi":
                writeCmd("\\pi");
                break;
            case "kSup":
                writeInput("^");
                break;
            case "kSub":
                writeInput("_");
                break;
            case "kDot":
                writeInput(".");
                break;
            case "kComma":
                writeInput(",");
                break;
            case "kBksp":
                writeKey("Backspace");
                break;
            case "kLeft":
                writeKey("Left");
                break;
            case "kRight":
                writeKey("Right");
                break;
            case "kC":
                setInput("");
                break;
            case "kAssign":
                writeInput("=");
                break;
            case "kMod":
                writeInput("mod");
                break;
            case "kA":
                writeInput("a");
                break;
            case "kB":
                writeInput("b");
                break;
            case "kCde":
                writeInput("c");
                break;
            case "kF":
                writeInput("f");
                break;
            case "kG":
                writeInput("g");
                break;
            case "kH":
                writeInput("h");
                break;
            case "kI":
                writeInput("i");
                break;
            case "kJk":
                writeInput("j");
                break;
            case "kL":
                writeInput("l");
                break;
            case "kM":
                writeInput("m");
                break;
            case "kNopq":
                writeInput("n");
                break;
            case "kRs":
                writeInput("r");
                break;
            case "kT":
                writeInput("t");
                break;
            case "kU":
                writeInput("u");
                break;
            case "kVw":
                writeInput("v");
                break;
            case "kX":
                writeInput("x");
                break;
            case "kY":
                writeInput("y");
                break;
            case "kZ":
                writeInput("z");
                break;
            case "kAnd":
                writeCmd("\\wedge");
                break;
            } // sw
            focusInput();
        }// key

        MQ.MathField($('#inputContainer')[0]);

        function getInput(){
            return MQ($('#inputContainer')[0]).latex();
        }

        function setInput(input){
            MQ($('#inputContainer')[0]).latex(input);
        }

        function writeInput(input){
            MQ($('#inputContainer')[0]).typedText(input);
        }

        function writeCmd(input){
            MQ($('#inputContainer')[0]).cmd(input);
        }

        function writeKey(input){
            MQ($('#inputContainer')[0]).keystroke(input);
        }

        function focusInput(input){
            MQ($('#inputContainer')[0]).focus();
        }        

        function tex2formula(tex){
            tex=tex.replace(/\\left/g, "");
            tex=tex.replace(/\\right/g, "");
            tex=tex.replace(/\\ /g, " ");
            tex=tex.replace(/\{/g, "(");
            tex=tex.replace(/\}/g, ")");

            return tex;
        }

        var sin = Math.sin, cos = Math.cos, tan = Math.tan;
        var asin = Math.asin, acos = Math.acos, atan = Math.atan;
        var exp = Math.exp, log = Math.log;
        var sqrt = Math.sqrt;
        var pi = Math.PI;
        var e = function(){return Math.exp(1);};
        var res;

        function process(){            
            const tex = getInput();
            console.log(tex);
            const input = tex2formula(tex);
            console.log(input);

            const tree_node = parser.parse_chunk(input+"\n"); // Using the imported function
            const code = tree_node.generate([],"window");
            
            console.log(code);
            let ev = eval(code);

            // update "res" variable
            let prev_res = res;
            res = function(){
                let n = arguments[0] || 1;
                if(n==1)
                    return ev;
                else
                    return prev_res(n-1);
            };

            let func = (typeof ev == "function");
            let span = $('<span></span>');
            span.html(func ? tex : tex + " = " + ev);
            MQ.StaticMath(span[0]);
            $('<p></p>').append(span).appendTo($("#output"));

            setInput('');
            focusInput();
        };

        $('.key').click(onKey);

        document.getElementById('kEnter').addEventListener('click', process);
        document.getElementById('inputContainer').addEventListener('keypress', (event)=>{
            if(event.key === 'Enter')
                process();
        });
        focusInput();
    </script>
</body>
</html>
